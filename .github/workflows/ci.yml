name: Django and frontend CI
permissions:
  contents: write
  actions: read
concurrency:
  group: cars-dealership-ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies and linter
        run: pip install -r requirements.txt ruff
      - name: Lint Python Files
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        run: |
          python -m compileall -q .
          ruff check . --select E9,F63,F7,F82
          python manage.py check

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm install
      - name: Lint JavaScript Files
        run: |
          npm --prefix server/frontend run build
          node --check scripts/capture_screenshots.mjs
          node --check scripts/capture_homepage_screenshot.mjs

  test:
    needs: [lint-python, lint-javascript]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        run: python manage.py check
      - name: Run migrations
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        run: python manage.py migrate --noinput
      - name: Seed sample data
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
          CREATE_DEMO_USER: 'true'
          DEMO_USER_PASSWORD: DemoPass123!
        run: python manage.py seed_data
      - name: Run Django tests
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        run: python manage.py test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm install
      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build
      - name: Generate real API and terminal evidence
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\\n' '$ python3 manage.py runserver 127.0.0.1:8000' > ../django_server
          PYTHONUNBUFFERED=1 python -u manage.py runserver 127.0.0.1:8000 >> ../django_server 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
            wait "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/fetchDealers >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/fetchDealers >/dev/null
          sleep 1

          printf '%s\\n' "$ curl -i -c cookies.txt -X POST http://127.0.0.1:8000/djangoapp/api/login/ -H 'Content-Type: application/json' -d '{\\"username\\":\\"demo\\",\\"password\\":\\"DemoPass123!\\"}'" > ../loginuser
          curl -i -c cookies.txt -X POST http://127.0.0.1:8000/djangoapp/api/login/ -H 'Content-Type: application/json' -d '{"username":"demo","password":"DemoPass123!"}' >> ../loginuser 2>&1
          printf '\\n' >> ../loginuser

          printf '%s\\n' "$ curl -i -b cookies.txt -c cookies.txt -X POST http://127.0.0.1:8000/djangoapp/api/logout/ -H 'Content-Type: application/json' -d '{}'" > ../logoutuser
          curl -i -b cookies.txt -c cookies.txt -X POST http://127.0.0.1:8000/djangoapp/api/logout/ -H 'Content-Type: application/json' -d '{}' >> ../logoutuser 2>&1
          printf '\\n' >> ../logoutuser

          printf '%s\\n' '$ curl -fsS http://127.0.0.1:8000/fetchDealers' > ../getalldealers
          curl -fsS http://127.0.0.1:8000/fetchDealers >> ../getalldealers
          printf '\\n' >> ../getalldealers

          printf '%s\\n' '$ curl -fsS http://127.0.0.1:8000/fetchReviews/dealer/1' > ../getdealerreviews
          curl -fsS http://127.0.0.1:8000/fetchReviews/dealer/1 >> ../getdealerreviews
          printf '\\n' >> ../getdealerreviews

          printf '%s\\n' '$ curl -fsS http://127.0.0.1:8000/fetchDealer/1' > ../getdealerbyid
          curl -fsS http://127.0.0.1:8000/fetchDealer/1 >> ../getdealerbyid
          printf '\\n' >> ../getdealerbyid

          printf '%s\\n' '$ curl -fsS http://127.0.0.1:8000/fetchDealers/Kansas' > ../getdealersbyState
          curl -fsS http://127.0.0.1:8000/fetchDealers/Kansas >> ../getdealersbyState
          printf '\\n' >> ../getdealersbyState

          printf '%s\\n' '$ curl -fsS http://127.0.0.1:8000/djangoapp/get_cars' > ../getallcarmakes
          curl -fsS http://127.0.0.1:8000/djangoapp/get_cars >> ../getallcarmakes
          printf '\\n' >> ../getallcarmakes

          printf '%s\\n' "$ curl -sS -X POST http://127.0.0.1:8000/djangoapp/api/analyze-review/ -H 'Content-Type: application/json' -d '{\\"review\\":\\"Fantastic services\\"}'" > ../analyzereview
          curl -sS -X POST http://127.0.0.1:8000/djangoapp/api/analyze-review/ -H 'Content-Type: application/json' -d '{"review":"Fantastic services"}' >> ../analyzereview
          printf '\\n' >> ../analyzereview

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > "${RUNNER_TEMP}/run-jobs.json"
          {
            echo "GitHub Actions workflow: Django and frontend CI"
            echo "Workflow run ID: ${GITHUB_RUN_ID}"
            echo "Commit SHA: ${GITHUB_SHA}"
            echo "Workflow URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
          } > ../CICD
          python - "${RUNNER_TEMP}/run-jobs.json" <<'PY' >> ../CICD
          import json
          import sys
          from datetime import datetime

          with open(sys.argv[1], encoding="utf-8") as handle:
              jobs = json.load(handle).get("jobs", [])

          required = ("Lint Python Files", "Lint JavaScript Files")
          for required_name in required:
              matches = [job for job in jobs if job.get("name") == required_name]
              if not matches:
                  print(f"Job: {required_name} — NOT FOUND IN THIS RUN")
                  continue
              job = matches[0]
              started = job.get("started_at")
              completed = job.get("completed_at")
              if started and completed:
                  begin = datetime.fromisoformat(started.replace("Z", "+00:00"))
                  end = datetime.fromisoformat(completed.replace("Z", "+00:00"))
                  duration = f"{(end - begin).total_seconds():.1f}s"
              else:
                  duration = "not yet available"
              print(f"Job: {job.get('name')}")
              print(f"Job ID: {job.get('id')}")
              print(f"Conclusion: {job.get('conclusion') or job.get('status')}")
              print(f"Duration: {duration}")
              print("Steps:")
              for step in job.get("steps", []):
                  conclusion = step.get("conclusion") or step.get("status") or "unknown"
                  mark = "PASS" if conclusion == "success" else conclusion.upper()
                  print(f"  [{mark}] {step.get('number')}. {step.get('name')}")
              print()
          PY

          {
            echo '$ python manage.py check'
            python manage.py check
            echo
            echo '$ python manage.py migrate --check'
            python manage.py migrate --check
            echo
            echo '$ python manage.py test'
            python manage.py test
            echo
            echo '$ npm run build'
            (cd frontend && npm run build)
            echo
            echo '$ curl -fsS http://127.0.0.1:8000/fetchDealers'
            curl -fsS http://127.0.0.1:8000/fetchDealers
            echo
          } >> ../CICD 2>&1
          cat ../django_server
      - name: Capture real local browser screenshots
        working-directory: server
        env:
          DJANGO_SECRET_KEY: test-only-secret-key
          DJANGO_DEBUG: 'True'
        shell: bash
        run: |
          set -euo pipefail
          CI_ADMIN_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(20))')
          export CI_ADMIN_PASSWORD
          python manage.py shell -c "import os; from django.contrib.auth.models import User; u, _ = User.objects.get_or_create(username='root'); u.is_staff=True; u.is_superuser=True; u.is_active=True; u.set_password(os.environ['CI_ADMIN_PASSWORD']); u.save()"
          python manage.py collectstatic --noinput
          python manage.py runserver 127.0.0.1:8000 > ../django_screenshot_server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb scrot
          cd frontend
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          cd ..
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/djangoapp/api/dealers/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/djangoapp/api/dealers/ >/dev/null
          xvfb-run -a -s "-screen 0 1600x1000x24" node ../scripts/capture_screenshots.mjs
      - name: Commit local rubric evidence files
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add django_server loginuser logoutuser getdealerreviews getalldealers getdealerbyid getdealersbyState getallcarmakes analyzereview CICD admin_login.png admin_logout.png get_dealers.png get_dealers_loggedin.png dealersbystate.png dealer_id_reviews.png dealership_review_submission.png added_review.png
          if git diff --cached --quiet; then
            echo "Evidence files are unchanged; no evidence commit required."
          else
            git commit -m "Add generated capstone submission evidence"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload command-output evidence files
        uses: actions/upload-artifact@v4
        with:
          name: cars-dealership-terminal-evidence
          path: |
            django_server
            loginuser
            logoutuser
            getdealerreviews
            getalldealers
            getdealerbyid
            getdealersbyState
            getallcarmakes
            analyzereview
            CICD
            admin_login.png
            admin_logout.png
            get_dealers.png
            get_dealers_loggedin.png
            dealersbystate.png
            dealer_id_reviews.png
            dealership_review_submission.png
            added_review.png
          if-no-files-found: error
